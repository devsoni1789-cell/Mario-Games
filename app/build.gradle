plugins {
    id 'com.android.application'
}

android {
    namespace 'com.superbros.retrorunner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.superbros.retrorunner'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
